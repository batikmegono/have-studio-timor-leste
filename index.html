<!DOCTYPE html>
<html lang="tet">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a192b">

  <title>HaVe Studio — Website ba Negósiu | US$45</title>

  <meta
    name="description"
    content="Website profisionál ba negósiu iha Timor-Leste. US$45 inklui domíniu .com no hosting durante tinan ida."
  >

  <style>
    :root {
      --navy: #0a192b;
      --navy-light: #142a43;
      --lime: #dfff53;
      --paper: #f8f8f2;
      --ink: #122237;
      --muted: #67737b;
      --line: #dce0d7;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 95px;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    a:focus-visible,
    button:focus-visible,
    summary:focus-visible {
      outline: 3px solid #5f9ce8;
      outline-offset: 5px;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1,
    h2 {
      letter-spacing: -0.055em;
      line-height: 1.08;
    }

    h1 {
      font-size: clamp(44px, 5.8vw, 78px);
    }

    h2 {
      font-size: clamp(33px, 4vw, 54px);
    }

    h3 {
      font-size: 21px;
      letter-spacing: -0.025em;
    }

    p {
      line-height: 1.75;
    }

    .wrap {
      width: min(1160px, calc(100% - 48px));
      margin-inline: auto;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 16px 23px;
      border: 0;
      border-radius: 8px;
      background: var(--lime);
      color: var(--navy);
      font-weight: 700;
      font-size: 14px;
      transition: transform 0.2s, background 0.2s;
    }

    .button::after {
      content: "↗";
      font-size: 21px;
      line-height: 1;
    }

    .button:hover {
      background: #edff9f;
      transform: translateY(-2px);
    }

    .button-dark {
      background: var(--navy);
      color: white;
    }

    .button-dark:hover {
      background: #203b58;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      font-size: 25px;
      letter-spacing: -1px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--lime);
      color: var(--navy);
      font-size: 20px;
      font-weight: 800;
      font-style: italic;
    }

    .brand-name {
      font-weight: 800;
    }

    .brand-studio {
      font-weight: 300;
    }

    /* Header */

    .header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: #0a192bf5;
      color: white;
      border-bottom: 1px solid #ffffff16;
      backdrop-filter: blur(15px);
    }

    .nav {
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      color: #bdc8d4;
      font-size: 12px;
    }

    .nav-links a:hover {
      color: var(--lime);
    }

    .language-switch {
      display: flex;
      gap: 3px;
      padding: 4px;
      border: 1px solid #ffffff30;
      border-radius: 7px;
    }

    .language-switch button {
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #b7c3cf;
      padding: 7px 10px;
      font-size: 11px;
    }

    .language-switch button[aria-pressed="true"] {
      background: white;
      color: var(--navy);
    }

    /* Hero */

    .hero {
      overflow: hidden;
      position: relative;
      padding: 80px 0;
      background:
        radial-gradient(circle at 90% 20%, #224b7650, transparent 48%),
        var(--navy);
      color: white;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 50px;
    }

    .hero .eyebrow {
      color: var(--lime);
      margin-bottom: 26px;
    }

    .hero h1 span {
      display: block;
    }

    .accent {
      color: var(--lime);
    }

    .hero-description {
      max-width: 470px;
      margin: 25px 0 30px;
      color: #afbdcd;
      font-size: 15px;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 23px;
      flex-wrap: wrap;
    }

    .text-link {
      font-size: 13px;
    }

    .hero-notes {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 24px;
      font-size: 11px;
      color: #a5b5c7;
    }

    .hero-notes span::before {
      content: "✓";
      margin-right: 7px;
      color: var(--lime);
    }

    /* Illustrative browser */

    .showcase {
      position: relative;
      padding-bottom: 55px;
      min-width: 0;
    }

    .browser {
      overflow: hidden;
      border: 1px solid #ffffff45;
      border-radius: 12px;
      background: #f7f4eb;
      color: var(--ink);
      box-shadow: 0 30px 65px #0004;
      transform: rotate(-3deg);
    }

    .browser-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 34px;
      padding: 0 12px;
      background: #e4e8e5;
      color: #7e8985;
      font-size: 9px;
    }

    .browser-dots {
      display: flex;
      gap: 4px;
    }

    .browser-dots i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #a9b5af;
    }

    .browser-address {
      padding: 5px 23px;
      border-radius: 4px;
      background: #f7f8f5;
    }

    .demo-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 23px;
    }

    .demo-brand {
      font-family: Georgia, serif;
      font-size: 20px;
      letter-spacing: -0.7px;
    }

    .demo-brand small {
      display: block;
      margin-top: 4px;
      font-family: Arial, sans-serif;
      font-size: 6px;
      letter-spacing: 2px;
    }

    .demo-menu {
      display: flex;
      gap: 12px;
      font-size: 8px;
    }

    .demo-scene {
      position: relative;
      min-height: 275px;
      overflow: hidden;
      background: #d4e2da;
    }

    .demo-scene svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .demo-content {
      position: relative;
      z-index: 1;
      padding: 30px 25px;
      max-width: 280px;
    }

    .demo-content h3 {
      font-family: Georgia, serif;
      font-size: 37px;
      font-weight: 400;
      letter-spacing: -1.5px;
      line-height: 1.08;
    }

    .demo-content p {
      max-width: 190px;
      margin-top: 14px;
      font-size: 9px;
      line-height: 1.7;
      color: #344c4e;
    }

    .demo-button {
      display: inline-block;
      margin-top: 17px;
      padding: 9px 13px;
      border-radius: 4px;
      background: #285554;
      color: white;
      font-size: 8px;
    }

    .demo-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 23px;
      font-size: 9px;
      color: #6f7c73;
    }

    .demo-bottom strong {
      display: block;
      font-family: Georgia, serif;
      font-size: 19px;
      font-weight: 400;
      color: var(--ink);
    }

    .price-tag {
      position: absolute;
      bottom: 18px;
      left: -8px;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 20px;
      border-radius: 10px;
      background: var(--lime);
      color: var(--navy);
      transform: rotate(-3deg);
      box-shadow: 0 10px 30px #0003;
    }

    .price-tag strong {
      font-size: 38px;
      letter-spacing: -2px;
    }

    .price-tag span {
      max-width: 105px;
      font-size: 10px;
      line-height: 1.6;
    }

    .demo-caption {
      display: block;
      margin-top: 24px;
      text-align: right;
      color: #8b9caf;
      font-size: 9px;
      letter-spacing: 0.08em;
    }

    /* Feature strip */

    .feature-strip {
      padding: 22px 0;
      background: var(--navy-light);
      color: #c0ccd6;
    }

    .feature-row {
      display: flex;
      justify-content: space-between;
      gap: 22px;
      flex-wrap: wrap;
      font-size: 11px;
    }

    .feature-row span::before {
      content: "✓";
      color: var(--lime);
      margin-right: 10px;
    }

    /* Shared sections */

    .section {
      padding: 85px 0;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 40px;
      margin-bottom: 40px;
    }

    .section-heading .eyebrow {
      margin-bottom: 18px;
      color: #718051;
    }

    .section-heading > p {
      max-width: 365px;
      color: var(--muted);
      font-size: 14px;
    }

    .benefits {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 35px;
    }

    .benefit {
      border-top: 1px solid #bec8bc;
      padding-top: 25px;
    }

    .benefit-number {
      display: block;
      margin-bottom: 28px;
      color: #879282;
      font-size: 11px;
    }

    .benefit-icon {
      display: grid;
      place-items: center;
      width: 43px;
      height: 43px;
      margin-bottom: 20px;
      border-radius: 50%;
      background: #e8edcf;
      font-size: 23px;
    }

    .benefit p {
      margin-top: 13px;
      color: var(--muted);
      font-size: 14px;
    }

    /* Examples */

    .examples-section {
      background: #eceedf;
    }

    .examples-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .example-card {
      overflow: hidden;
      border: 1px solid #d2dac9;
      border-radius: 13px;
      background: #fffffa;
    }

    .example-art {
      height: 180px;
      position: relative;
      overflow: hidden;
      padding: 26px;
    }

    .example-art strong {
      position: relative;
      z-index: 2;
      display: block;
      max-width: 160px;
      font-family: Georgia, serif;
      font-size: 30px;
      line-height: 1.1;
      font-weight: 400;
    }

    .example-art small {
      position: relative;
      z-index: 2;
      display: block;
      margin-bottom: 16px;
      font-size: 8px;
      letter-spacing: 2px;
    }

    .art-travel {
      background: #c7dcd5;
    }

    .art-travel::before {
      content: "";
      position: absolute;
      width: 230px;
      height: 190px;
      right: -80px;
      bottom: -90px;
      border-radius: 50%;
      background: #548f91;
      box-shadow: -30px -20px 0 #89b4a4;
    }

    .art-food {
      background: #eadfc8;
    }

    .art-food::before {
      content: "";
      position: absolute;
      right: -25px;
      bottom: -60px;
      width: 190px;
      height: 190px;
      border: 24px solid #f8f5e9;
      border-radius: 50%;
      background: #779c5c;
      box-shadow: 0 5px 30px #775d2820;
    }

    .art-shop {
      background: #dedbd0;
    }

    .art-shop::before {
      content: "";
      position: absolute;
      right: 25px;
      bottom: -20px;
      width: 100px;
      height: 140px;
      border-radius: 18px 18px 0 0;
      background: #ac8c68;
      transform: rotate(12deg);
      box-shadow: -30px 20px 0 #c4af92;
    }

    .example-info {
      padding: 25px;
    }

    .example-info h3 {
      font-size: 19px;
    }

    .example-info p {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .example-info a {
      display: inline-block;
      margin-top: 20px;
      border-bottom: 1px solid #a6b197;
      font-size: 12px;
      padding-bottom: 4px;
    }

    .examples-note {
      margin-top: 20px;
      color: #6d7965;
      font-size: 11px;
    }

    /* Package */

    .package-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 65px;
      align-items: start;
    }

    .package-intro .eyebrow {
      color: #718051;
      margin-bottom: 20px;
    }

    .package-intro > p {
      margin: 22px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .update-box {
      display: flex;
      gap: 20px;
      padding: 26px 0;
      margin-top: 20px;
      border-top: 1px solid var(--line);
    }

    .update-price {
      white-space: nowrap;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .update-box h3 {
      font-size: 16px;
      margin-bottom: 9px;
    }

    .update-box p {
      color: var(--muted);
      font-size: 12px;
    }

    .renewal-box {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 9px;
    }

    .renewal-box h3 {
      margin-bottom: 10px;
      font-size: 15px;
    }

    .renewal-box p {
      color: var(--muted);
      font-size: 12px;
    }

    .price-card {
      padding: 36px;
      border-radius: 17px;
      background: var(--navy);
      color: white;
    }

    .price-card .eyebrow {
      color: var(--lime);
    }

    .price {
      margin-top: 17px;
      font-size: 91px;
      font-weight: 800;
      letter-spacing: -6px;
      line-height: 1.2;
    }

    .price small {
      font-size: 24px;
      letter-spacing: -1px;
      vertical-align: top;
      position: relative;
      top: 21px;
      margin-right: 5px;
    }

    .price-description {
      color: #a9bace;
      font-size: 12px;
    }

    .included {
      list-style: none;
      padding: 23px 0 0;
      margin: 25px 0;
      border-top: 1px solid #ffffff25;
    }

    .included li {
      display: flex;
      gap: 12px;
      margin-bottom: 17px;
      color: #d5dfea;
      font-size: 13px;
      line-height: 1.5;
    }

    .included li::before {
      content: "✓";
      color: var(--lime);
    }

    .price-card .button {
      width: 100%;
    }

    .fine-print {
      margin-top: 17px;
      color: #9aaec3;
      font-size: 11px;
      line-height: 1.8;
    }

    /* Process */

    .process-section {
      background: var(--navy);
      color: white;
    }

    .process-section .eyebrow {
      color: var(--lime);
    }

    .process-section .section-heading > p {
      color: #acbdcf;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 28px;
    }

    .step {
      border-top: 1px solid #415365;
      padding-top: 22px;
    }

    .step-number {
      display: block;
      color: #6e889d;
      font-size: 40px;
      letter-spacing: -2px;
      margin-bottom: 25px;
    }

    .step h3 {
      font-size: 18px;
    }

    .step p {
      margin-top: 13px;
      color: #acbdcf;
      font-size: 13px;
    }

    /* FAQ */

    .faq-grid {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 70px;
    }

    .faq-heading .eyebrow {
      margin-bottom: 20px;
      color: #718051;
    }

    details {
      border-bottom: 1px solid var(--line);
    }

    summary {
      position: relative;
      padding: 23px 30px 23px 0;
      list-style: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.6;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::after {
      position: absolute;
      right: 0;
      top: 21px;
      content: "+";
      font-size: 24px;
      font-weight: 400;
    }

    details[open] summary::after {
      content: "−";
    }

    details p {
      padding: 0 24px 24px 0;
      color: var(--muted);
      font-size: 13px;
    }

    /* Contact */

    .contact-section {
      padding-top: 0;
    }

    .contact-box {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 50px;
      align-items: center;
      padding: 50px;
      border-radius: 20px;
      background: #e8edce;
    }

    .contact-box .eyebrow {
      color: #677a45;
      margin-bottom: 22px;
    }

    .contact-box h2 {
      font-size: clamp(34px, 4vw, 47px);
    }

    .contact-description {
      margin-top: 22px;
      max-width: 510px;
      color: #65745e;
      font-size: 14px;
    }

    .contact-links {
      display: flex;
      align-items: flex-start;
      flex-direction: column;
      gap: 20px;
      margin-top: 28px;
    }

    .email-link {
      font-size: 14px;
      text-decoration: underline;
      text-underline-offset: 5px;
      overflow-wrap: anywhere;
    }

    .contact-summary {
      padding: 28px;
      border: 1px solid #bdc9a0;
      border-radius: 12px;
      background: #ffffff25;
    }

    .contact-summary strong {
      display: block;
      font-size: 64px;
      letter-spacing: -4px;
    }

    .contact-summary p {
      margin-top: 15px;
      font-size: 13px;
      color: #65745e;
    }

    /* Footer */

    .footer {
      padding: 35px 0;
    }

    .footer-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 25px;
    }

    .footer-top p {
      color: var(--muted);
      font-size: 11px;
    }

    .footer-bottom {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding-top: 22px;
      margin-top: 25px;
      border-top: 1px solid var(--line);
      font-size: 10px;
      color: var(--muted);
    }

    .privacy {
      max-width: 720px;
      margin-top: 20px;
      color: var(--muted);
      font-size: 11px;
    }

    .sticky-mobile {
      display: none;
    }

    /* Tablet */

    @media (max-width: 950px) {
      .hero-grid {
        gap: 30px;
      }

      .hero h1 {
        font-size: 57px;
      }

      .demo-menu {
        display: none;
      }

      .package-grid {
        gap: 35px;
      }

      .contact-box {
        padding: 35px;
        gap: 35px;
      }

      .examples-grid {
        gap: 14px;
      }

      .example-info {
        padding: 20px;
      }
    }

    /* Mobile */

    @media (max-width: 720px) {
      html {
        scroll-padding-top: 85px;
      }

      .wrap {
        width: calc(100% - 36px);
      }

      .nav {
        height: 70px;
      }

      .brand {
        gap: 6px;
        font-size: 22px;
      }

      .brand-mark {
        width: 26px;
        height: 26px;
        font-size: 17px;
      }

      .nav-links {
        display: none;
      }

      .hero {
        padding: 44px 0;
      }

      .hero-grid {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .hero .eyebrow {
        font-size: 9px;
        margin-bottom: 23px;
      }

      .hero h1 {
        font-size: clamp(43px, 10vw, 62px);
      }

      .hero-description {
        font-size: 14px;
      }

      .hero-actions {
        gap: 20px;
      }

      .hero-actions .button {
        padding: 16px 18px;
        font-size: 13px;
      }

      .hero-notes {
        font-size: 10px;
        gap: 13px;
      }

      .showcase {
        margin: 0 8px;
      }

      .demo-content {
        padding: 25px 20px;
      }

      .demo-content h3 {
        font-size: 32px;
      }

      .demo-scene {
        min-height: 240px;
      }

      .demo-nav {
        padding: 18px 20px;
      }

      .demo-bottom {
        padding: 18px 20px;
      }

      .demo-bottom strong {
        font-size: 17px;
      }

      .price-tag {
        padding: 13px 17px;
        gap: 13px;
      }

      .price-tag strong {
        font-size: 33px;
      }

      .feature-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        font-size: 10px;
      }
